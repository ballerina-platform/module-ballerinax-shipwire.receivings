openapi: 3.0.1
info:
  title: Shipwire Receivings API
  description: Allows managing inventory at Shipwire and Shipwire Anywhere warehouses using receiving
    orders
  version: '3.0'
servers:
- url: https://api.shipwire.com/api
security:
- basicAuth: []
paths:
  /v3/receivings:
    get:
      tags:
      - Receivings
      summary: Get list of advance ship notices
      description: Get an itemized list of receivings.
      operationId: listReceivings
      parameters:
      - name: expand
        in: query
        description: Expand receivings data in the response, instead of accessing directly via a URL (comma
          separated list). See resources `Holds`, `Instruction Recipients`, `Items`, `Shipments`, `labels`
          and `Trackings` for information on the data model returned by this parameter
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: enum
            enum:
            - holds
            - instructionsRecipients
            - items
            - shipments
            - labels
            - trackings
            - all
      - name: commerceName
        in: query
        description: Filter by commerceName (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: transactionId
        in: query
        description: Filter by transactionId (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: externalId
        in: query
        description: Filter by externalId (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: orderId
        in: query
        description: Filter by orderId (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: orderNo
        in: query
        description: Filter by orderNo (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: status
        in: query
        description: Filter by status (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
          format: enum
          enum:
          - processed
          - canceled
          - completed
          - delivered
          - returned
          - submitted
          - held
          - tracked
      - name: updatedAfter
        in: query
        description: 'Only show resources updated after this date (ISO 8601 format, ex: "2014-05-30T13:08:29-07:00")'
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: warehouseId
        in: query
        description: Filter by warehouseId (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: warehouseExternalId
        in: query
        description: Filter by warehouseExternalId (comma separated list)
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: vendorId
        in: query
        description: Filter by vendorId
        required: false
        style: form
        explode: true
        schema:
          type: string
      - name: vendorExternalId
        in: query
        description: Filter by vendorExternalId
        required: false
        style: form
        explode: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ListReceivingsResponse'
    post:
      tags:
      - Receivings
      summary: Create an advance ship notice
      description: Create a new receiving.
      operationId: createReceiving
      parameters:
      - name: expand
        in: query
        description: Expand receivings data in the response, instead of accessing directly via a URL (comma
          separated list). See resources `Holds`, `Instruction Recipients`, `Items`, `Shipments`, `labels`
          and `Trackings` for information on the data model returned by this parameter
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: enum
            enum:
            - holds
            - instructionsRecipients
            - items
            - shipments
            - labels
            - trackings
            - all
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivingRequest'
        required: true
        description: Receiving order details to create, including items, shipping and routing
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateReceivingResponse'
      x-codegen-request-body-name: body
  /v3/receivings/{id}:
    get:
      tags:
      - Receivings
      summary: Get advance ship notice
      description: Get information about this receiving.
      operationId: getReceiving
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: expand
        in: query
        description: Expand receivings data in the response, instead of accessing directly via a URL (comma
          separated list). See resources `Holds`, `Instruction Recipients`, `Items`, `Shipments`, `labels`
          and `Trackings` for information on the data model returned by this parameter
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: enum
            enum:
            - holds
            - instructionsRecipients
            - items
            - shipments
            - labels
            - trackings
            - all
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingResponse'
    put:
      tags:
      - Receivings
      summary: Update an advance ship notice
      description: Modify information about this receiving.
      operationId: updateReceiving
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: expand
        in: query
        description: Expand receivings data in the response, instead of accessing directly via a URL (comma
          separated list). See resources `Holds`, `Instruction Recipients`, `Items`, `Shipments`, `labels`
          and `Trackings` for information on the data model returned by this parameter
        required: false
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
            format: enum
            enum:
            - holds
            - instructionsRecipients
            - items
            - shipments
            - labels
            - trackings
            - all
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateReceivingRequest'
        required: true
        description: Receiving order fields to update
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingResponse'
      x-codegen-request-body-name: body
  /v3/receivings/{id}/cancel:
    post:
      tags:
      - Receivings
      summary: Cancel a receiving order
      description: Cancel this receiving.
      operationId: cancelReceiving
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReceivingResponse'
  /v3/receivings/{id}/labels/cancel:
    post:
      tags:
      - Receivings
      summary: Cancel a receiving label
      description: Cancel shipping labels on this receiving.
      operationId: cancelReceivingLabels
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CancelReceivingLabelsResponse'
  /v3/receivings/{id}/holds:
    get:
      tags:
      - Receivings
      summary: Get holds detail
      description: Get the list of holds, if any, on this receiving.
      operationId: listReceivingHolds
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      - name: includeCleared
        in: query
        description: When set to 1, response includes holds that have been cleared
        required: false
        style: form
        explode: true
        schema:
          type: integer
          enum:
          - 0
          - 1
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingHoldsResponse'
  /v3/receivings/{id}/instructionsRecipients:
    get:
      tags:
      - Receivings
      summary: Get instructions and the recipients contact details
      description: Get instructions and email recipients for this receiving.
      operationId: listReceivingInstructionsRecipients
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingInstructionsRecipientsResponse'
  /v3/receivings/{id}/extendedAttributes:
    get:
      tags:
      - Receivings
      summary: Get receiving extended attributes
      description: Get the extended attributes of this receiving.
      operationId: listReceivingExtendedAttributes
      parameters:
      - name: id
        in: path
        description: The receiving's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingExtendedAttributesResponse'
  /v3/receivings/{id}/items:
    get:
      tags:
      - Receivings
      summary: Get items detail
      description: Get the contents of this receiving.
      operationId: listReceivingItems
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingItemsResponse'
  /v3/receivings/{id}/shipments:
    get:
      tags:
      - Receivings
      summary: Get shipment details
      description: Get shipping dimension and container information.
      operationId: listReceivingShipments
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingShipmentsResponse'
  /v3/receivings/{id}/trackings:
    get:
      tags:
      - Receivings
      summary: Get trackings detail
      description: Get tracking information for this receiving.
      operationId: listReceivingTrackings
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingTrackingsResponse'
  /v3/receivings/{id}/labels:
    get:
      tags:
      - Receivings
      summary: Get labels detail
      description: 'Get labels information for this receiving.

        To retrieve the labels as PDF add the following header to the request:

        Accept: application/pdf'
      operationId: listReceivingLabels
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReceivingLabelsResponse'
            application/pdf:
              schema:
                $ref: '#/components/schemas/ReceivingLabelsResponse'
  /v3.1/receivings/{id}/markComplete:
    post:
      tags:
      - Receivings
      summary: Mark the receiving completed
      description: Mark this receiving order as complete. This endpoint works only for Shipwire Anywhere
        warehouses.
      operationId: markReceivingComplete
      parameters:
      - name: id
        in: path
        description: The advance ship notice's ID
        required: true
        style: simple
        explode: false
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MarkReceivingCompleteResponse'
components:
  schemas:
    ReceivingItemExtendedAttributes:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ReceivingExtendedAttributesResource'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
    ReceivingHoldsResponseResource:
      type: object
      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingHoldsResourceItems'
    DocumentsResource:
      type: object
      properties:
        receivingGuide:
          type: string
          description: Link to dowload a Shipwire Warehouse Receiving guide
          example: https://dnjngsjeb.clt.net/content/uploads/2018/08/26223422/Receiving_Guide_Final.pdf
        genericLabel:
          type: string
          description: Link to dowload a generic label document
          example: https://api.shipwire.com/api/v3/receivings/8411/documents/genericLabel
    ReceivingShipmentsResponseResourceItems:
      type: object
      properties:
        resource:
          type: object
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/shipments/71
    Trackings:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/TrackingsResource'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/trackings?offset=0&limit=20&expand=all
      description: Specifies shipment tracking details. See `trackings` resource
    ReceivingResponse:
      type: object
      properties:
        resource:
          type: object
          properties: {}
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411?expand=all
        status:
          type: integer
          description: This is the HTTP status code
          example: 200
    ReceivingServerResponse:
      title: Receiving Server Response
      type: object
      properties:
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings?offset=0&limit=20&expand=all
        status:
          type: integer
          description: This is the HTTP status code
          example: 200
      description: Receiving Server Response
    Label:
      type: object
      properties:
        orderExternalId:
          maxLength: 32
          minLength: 1
          type: string
          description: This is the receving order ID in the external system on which the hold is applied
          example: ORD00101
        labelId:
          type: integer
          description: A unique ID assigned to each shipping label in the shipwire system
          example: 1
        orderId:
          type: integer
          description: This is the receving order ID in the shipwire system on which the hold is applied
          example: 8411
    ReceivingInstructionsRecipientsResponse:
      title: Get instructions recipients details response
      type: object
      properties:
        resource:
          type: object
          description: The instructions and recipients contact details of the receiving
          allOf:
          - $ref: '#/components/schemas/ReceivingInstructionsRecipientsResponseResource'
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/instructionsRecipients?offset=0&limit=20
        status:
          type: integer
          description: This is the HTTP status code
          example: 200
      description: Get instructions recipients details response
    ReceivingItemsResponse:
      title: Get items details response
      type: object
      properties:
        resource:
          type: object
          description: The items being shipped to Shipwire in the receiving
          allOf:
          - $ref: '#/components/schemas/ReceivingInstructionsRecipientsResponseResource'
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/items?expand=all&offset=0&limit=20
        status:
          type: integer
          description: This is the HTTP status code
          example: 200
      description: Get items details response
    TrackingsResourceItems:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Tracking'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/473168411/trackings/3831
    ReceivingLotControlResource:
      type: object
      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingLotControlResourceItems'
    ReceivingLotControl:
      type: object
      properties:
        quantity:
          type: integer
          description: The  quantity of total SKU items belonging to the particular lot
          example: 10
        lotId:
          type: string
          description: A unique ID assigned to a particular quantity or lot of material shipped from a
            siingle merchant
          example: hgf897
        expirationDate:
          type: string
          description: This is the expiry date of the product belonging to the particular lot
          format: date-time
          example: '2018-05-28T00:00:00-07:00'
    ExtendedAttributes:
      type: object
      properties:
        name:
          type: string
          description: Name of the extended attribute i.e. any additional information as per the customer
            request to be added in the receiving order. (e.g. return instructions)
          example: returnInstruction
        type:
          type: string
          description: Data type of the extended attribute value i.e. a string or integer
          example: string
        value:
          type: string
          description: Value of the extended attribute which depends on the customer request. (e.g. For
            return instructions the value can be mail in or store)
          example: Mail in or store
    ReceivingInstructionsRecipientsResponseResource:
      type: object
      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingInstructionsRecipientsResponseResourceItems'
    ReceivingLotControlResourceItems:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ReceivingLotControl'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
    MarkReceivingCompleteResponse:
      title: Mark the receiving completed response
      type: object
      properties:
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
        status:
          type: integer
          description: This is the HTTP status code
          format: int32
          example: 200
      description: Mark the receiving as completed
    ReceivingItemsResource:
      type: object
      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingItemsResourceItems'
    InstructionsRecipient:
      type: object
      properties:
        note:
          type: string
          description: May be used to provide instructions to recipient on how to process and store received
            inventory
        name:
          type: string
          description: Name of individual responsible for processing order/inventory at receiving facility
          example: David
        email:
          type: string
          description: Email address of individual responsible for processing order/inventory at receiving
            facility
          format: email
          example: shipping@wesellem.com
    ReceivingItemsResourceItems:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ReceivingItem'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/411/items?expand=all&offset=0&limit=20
    AddressResource:
      type: object
      properties:
        country:
          maxLength: 50
          minLength: 1
          type: string
          description: Country from where the inventory is shipped
          example: United States
        address3:
          maxLength: 50
          minLength: 1
          type: string
          description: This is the third line of the address of the shipper
        address2:
          maxLength: 50
          minLength: 1
          type: string
          description: This is the second line of the address of the shipper
          example: Apt 10
        city:
          maxLength: 25
          minLength: 1
          type: string
          description: City from where the inventory is shipped
          example: Schenectady
        phone:
          maxLength: 50
          minLength: 1
          type: string
          description: Contact phone number of the shipper for any communication
          example: '1234567890'
        address1:
          maxLength: 50
          minLength: 1
          type: string
          description: This is the first line of the address of the shipper
          example: 11 Prsilla St
        postalCode:
          maxLength: 10
          minLength: 1
          type: string
          description: Postal code of the area from where the inventory is shipped
          example: '12345'
        name:
          maxLength: 35
          minLength: 1
          type: string
          description: Name of the shipper
          example: Stephen Alexander
        state:
          maxLength: 25
          minLength: 1
          type: string
          description: State from where the inventory is shipped
          example: NY
        email:
          type: string
          description: Email address of the shipper. i.e. the merchant sending inventory to the Shipwire
            warehouse
          format: email
          example: shipping@wesellem.com
    LabelsResourceItems:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/Label'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
