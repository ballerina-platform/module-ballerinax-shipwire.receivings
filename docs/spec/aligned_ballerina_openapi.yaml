      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/TrackingsResourceItems'
    Routing:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/RoutingResource'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
      description: Package routing details
    RoutingResource:
      type: object
      properties:
        warehouseRegion:
          type: string
          description: This is the place where the warehouse is located
          example: LA
        originLatitude:
          type: number
          description: Latitude of the warehouse. This is useful for routing purposes to find the nearest
            warehouse
          format: decimal
          example: -117.396
        originLongitude:
          type: number
          description: Longitude of the warehouse. This is useful for routing purposes to find the nearest
            warehouse
          format: decimal
          example: 34.0396
        warehouseId:
          type: integer
          description: A unique identifier for a Shipwire or Shipwire Anywhere warehouse
          example: 11
        warehouseExternalId:
          type: string
          description: A unique user-provided identifier for a Shipwire Anywhere warehouse in an external
            system
          example: WAR00011
        warehouseName:
          type: string
          description: This is the name of the warehouse
          example: LA-Warehouse
    ReceivingHoldsResponse:
      title: Get instructions recipients details response
      type: object
      properties:
        resource:
          type: object
          description: The holds placed on the receiving, with links to each hold
          allOf:
          - $ref: '#/components/schemas/ReceivingHoldsResponseResource'
        message:
          type: string
          description: This is the HTTP status message
          example: Successful
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/holds?expand=all
        status:
          type: integer
          description: This is the HTTP status code
          example: 200
      description: Get instructions recipients details response
    CreateReceivingRequest:
      title: Create an advance ship notice request
      required:
      - arrangement
      - items
      - options
      - shipFrom
      - shipments
      type: object
      properties:
        arrangement:
          $ref: '#/components/schemas/Arrangement'
        shipFrom:
          $ref: '#/components/schemas/AddressResource'
        orderNo:
          maxLength: 25
          minLength: 1
          type: string
          description: Purchase Order number associated with the Advance Shipping Notice
          example: foobar1
        trackings:
          type: array
          description: Specifies shipment tracking details. See `trackings` resource
          items:
            $ref: '#/components/schemas/Tracking'
        options:
          $ref: '#/components/schemas/OptionsResource'
        externalId:
          maxLength: 32
          minLength: 1
          type: string
          description: Unique ID of the Advance Shipping Notice in an external system
          example: ClientID123456
        expectedDate:
          type: string
          description: Date on which the Advance Shipping Notice is expected to arrive at the Shipwire
            warehouse
          format: date-time
          example: '2014-05-27T00:00:00-07:00'
        shipments:
          $ref: '#/components/schemas/Shipment'
        items:
          type: array
          description: Items being shipped to Shipwire
          items:
            $ref: '#/components/schemas/CreateReceivingItem'
        extendedAttributes:
          type: array
          description: Extended attributes of the advance ship notice
          items:
            $ref: '#/components/schemas/ExtendedAttributes'
        labels:
          $ref: '#/components/schemas/Label'
        instructionsRecipients:
          type: array
          items:
            $ref: '#/components/schemas/InstructionsRecipient'
    Arrangement:
      type: object
      properties:
        phone:
          type: string
          description: Contact phone number of the person from Shipwire system responsible for coordinating
            with the carrier or supplier for arranging delivery if needed
          example: '7822878787'
        contact:
          type: string
          description: Contact name of the person from Shipwire system responsible for coordinating with
            the carrier or supplier for arranging delivery if needed
          example: Andrew Carr
        type:
          type: string
          description: The arrangement type, which tells Shipwire how the shipment will be delivered to
            the warehouse
          format: enum
          example: none
          enum:
          - none
          - overseas
          - label
          - pickup
          - ltlpickup
          - portpickup
      description: The arrangement type tells Shipwire what further actions to take once the advance ship
        notice is created
    ListReceivingsResponseResourceItems:
      type: object
      properties:
        resource:
          type: object
    ReceivingItemLotControl:
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ReceivingLotControlResource'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
    CancelReceivingLabelsResponse:
      title: Cancel a receiving label response
      type: object
      properties:
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
        message:
          type: string
          description: This is the HTTP status message
          example: Labels cancelled
        status:
          type: integer
          description: This is the HTTP status code
          format: int32
          example: 200
    ReceivingShipmentsResponseResource:
      type: object
      properties:
        next:
          type: string
          description: A link used to fetch the next set or page of items in the API response
        total:
          type: integer
          description: Total number of available items in the API response
          example: 1
        offset:
          type: integer
          description: This is an integer that matches the offset given in the request and dictates the
            number of items to skip while fetching results. For example, there is a preset limit of 20
            results per page. If there are 30 total results and offset is set to 20, then the response
            will show the second "page" of results, with items 21 to 30
          example: 0
        previous:
          type: string
          description: A link used to fetch the previous set or page of items in the API response
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReceivingShipmentsResponseResourceItems'
    EventsResource:
      type: object
      properties:
        deliveredDate:
          type: string
          description: Date on which the inventory is received at the Shipwire warehouse
          format: date-time
        processedDate:
          type: string
          description: Date on which the Advance Shipping Notice is processed i.e. the details of inventory
            are entered in the Warehouse Management System
          format: date-time
          example: '2018-05-27T07:39:20-07:00'
        createdDate:
          type: string
          description: Date on which the Advance Shipping Notice is created by the merchant
          format: date-time
          example: '2018-05-27T07:39:20-07:00'
        lastManualUpdateDate:
          type: string
          description: Date on which the Advance Shipping Notice was last edited by the merchant manually
          format: date-time
          example: '2018-05-27T00:00:00-07:00'
        pickedUpDate:
          type: string
          description: Date on which the inventory is picked up from the Shipper's address
          format: date-time
        expectedDate:
          type: string
          description: Date on which the inventory is expected to arrive at the Shipwire warehouse
          format: date-time
          example: '2018-05-27T00:00:00-07:00'
        submittedDate:
          type: string
          description: Date on which the Advance Shipping Notice is submitted to the Shipwire warehouse
          format: date-time
          example: '2018-05-27T17:39:35-07:00'
        completedDate:
          type: string
          description: Date on which the Advance Shipping Notice is completed by the merchant
          format: date-time
          example: '2018-05-27T17:39:35-07:00'
        cancelledDate:
          type: string
          description: Date on which the Advance Shipping Notice is cancelled due to any reason
          format: date-time
          example: '2018-05-27T00:00:00-07:00'
        returnedDate:
          type: string
          description: Date on which the partial/full inventory is returned to the Shipper's address
          format: date-time
          example: '2018-05-27T00:00:00-07:00'
    ReceivingInstructionsRecipientsResponseResourceItems:
      type: object
      properties:
        resource:
          type: object
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
    ReceivingItems:
      title: Receiving Items
      type: object
      properties:
        resource:
          $ref: '#/components/schemas/ReceivingItemsResource'
        resourceLocation:
          type: string
          description: A URL that gives more information about the linked resource. A 'null' value would
            mean that no further information is available for that resource
          example: https://api.shipwire.com/api/v3/receivings/8411/items?expand=all&offset=0&limit=20
      description: Items being shipped to Shipwire
